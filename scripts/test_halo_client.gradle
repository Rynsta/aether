allprojects {
    afterEvaluate {
        def testRoot = layout.buildDirectory.dir('halo-client-test').get().asFile
        loom.runs.getByName('client').runDir(new File(testRoot, 'run').absolutePath)

        def compileClientTest = tasks.register('compileHaloClientTest', JavaCompile) {
            dependsOn tasks.named('classes')
            source fileTree('src/clientTest/java') { include '**/HaloClientTest.java' }
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = new File(testRoot, 'classes')
            options.release = 25
        }
        def clientTestJar = tasks.register('jarHaloClientTest', Jar) {
            dependsOn compileClientTest
            from new File(testRoot, 'classes')
            from 'src/clientTest/halo-resources'
            archiveFileName = 'halo-client-test.jar'
            destinationDirectory = testRoot
        }
        tasks.named('runClient') {
            dependsOn clientTestJar
            jvmArgs "-Dfabric.addMods=${new File(testRoot, 'halo-client-test.jar').absolutePath}",
                    '-Dfabric.client.gametest', '-Dfabric.client.gametest.modid=aether_halo_test'
        }
    }
}
